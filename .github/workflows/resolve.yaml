#------------------------------------------------------------------------------------#     

    resolve-domains:
      name: 🛰️ Resolve || 🔰 Clean Subs 📡
      runs-on: ubuntu-latest
      needs: [puredns-resolve, shuffledns-resolve]
      
      steps:        
        - name: Checkout repository
          uses: actions/checkout@v7
          with:
            path: main  
            filter: "blob:none" #https://github.blog/2020-12-21-get-up-to-speed-with-partial-clone-and-shallow-clone/
            
        - name: Install Coreutils
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            sudo apt update -y
            sudo apt install coreutils curl dos2unix jq moreutils wget -y
            pip install ansi2txt
            #Subzuf
            pip3 install "git+https://github.com/elceef/subzuf.git"
            # Do again, sometimes fails
            sudo apt install coreutils curl dos2unix jq moreutils wget -y
            pip install ansi2txt
            #Subzuf
            pip3 install "git+https://github.com/elceef/subzuf.git"            
            # For TG BOT Notifs
            pip install apprise 
            pip install apprise 2>/dev/null
            # For neofetch
            pip install archey4
            pip install archey4 2>/dev/null
          continue-on-error: true
  
        - name: Install Addons & Deps
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            #Run (pub.ajam.dev is dead; _init_deps.sh is the Toolpacks-based
            #replacement, curled from rishi since it doesn't live in this repo)
            curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/hritikrosan/rishi/main/.github/scripts/_init_deps.sh" -o "./_init_deps.sh"
            dos2unix --quiet "./_init_deps.sh" 2>/dev/null ; sudo chmod +xwr "./_init_deps.sh" ; source "./_init_deps.sh"
          continue-on-error: true

        - name: Setup Env
          run: |
            # Create tmp dir for resolvers
            mkdir /tmp/resolver

        - name: Download Resolver from Artifacts
          uses: actions/download-artifact@v4
          with:
            path: /tmp/resolver

        - name: Download & Run Resolver
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            # Download
            curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/hritikrosan/rishi/main/.github/scripts/resolve_domains.sh" -o "./resolve_domains.sh"
            # Dos2unix
            dos2unix "./resolve_domains.sh"
            # chmod +xwr
            sudo chmod +xwr "./resolve_domains.sh"
            # Run (visible output for debugging; was >/dev/null 2>&1, which hid
            # the real crash reason on the last failed run)
            bash "./resolve_domains.sh" 2>&1 | tee "/tmp/resolve_domains.log"
          continue-on-error: true

        - name: Upload_Resolved_Output
          uses: actions/upload-artifact@v4
          with:
              name: resolved_domains
              path: |
                /tmp/resolved_domains.7z
                /tmp/resolve_domains.log
