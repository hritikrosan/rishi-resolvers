name: 🛰️ Resolve || 🔰 Clean Subs 📡
#MAX_RUNTIME: 30-60 Minutes
on:
  workflow_dispatch: # Whenever manually run from actions-tab
 # Uncomment & Trigger manually 
 # schedule:
 # - cron: "15 20 * * *" #( 08:15 PM UTC --> 02:00 AM Midnight )
#------------------------------------------------------------------------------------#    
env:
  # DO NOT MODIFY ANYTHING ELSE
  INVENTORY_REPO_USER: "${{ secrets.INVENTORY_REPO_USER }}"
  INVENTORY_REPO_TOKEN: "${{ secrets.INVENTORY_REPO_TOKEN }}"
#------------------------------------------------------------------------------------#  
jobs:
#------------------------------------------------------------------------------------#
    puredns-resolve:
      name: Resolve with PureDNS
      runs-on: ubuntu-latest
      
      steps:        
        - name: Checkout repository
          uses: actions/checkout@v7
          with:
            path: main
            filter: "blob:none" #https://github.blog/2020-12-21-get-up-to-speed-with-partial-clone-and-shallow-clone/

        - name: Install Coreutils
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            sudo apt update -y
            sudo apt install coreutils curl dos2unix jq moreutils wget -y
            pip install ansi2txt
            #Subzuf
            pip3 install "git+https://github.com/elceef/subzuf.git"
            # Do again, sometimes fails
            sudo apt install coreutils curl dos2unix jq moreutils wget -y
            pip install ansi2txt
            #Subzuf
            pip3 install "git+https://github.com/elceef/subzuf.git"            
            # For TG BOT Notifs
            pip install apprise 
            pip install apprise 2>/dev/null
            # For neofetch
            pip install archey4
            pip install archey4 2>/dev/null
          continue-on-error: true
  
        - name: Install Addons & Deps
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            #Run (pub.ajam.dev is dead; _init_deps.sh is the Toolpacks-based
            #replacement, curled from rishi since it doesn't live in this repo)
            curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/hritikrosan/rishi/main/.github/scripts/_init_deps.sh" -o "./_init_deps.sh"
            dos2unix --quiet "./_init_deps.sh" 2>/dev/null ; sudo chmod +xwr "./_init_deps.sh" ; source "./_init_deps.sh"
          continue-on-error: true

        - name: Download & Run Resolver
          run: |
            # Presets
            set -x ; set +e
            #--------------#
            # Download
            curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/hritikrosan/rishi/main/.github/scripts/resolve_domains_puredns.sh" -o "./resolve_domains_puredns.sh"
            # Dos2unix
            dos2unix "./resolve_domains_puredns.sh"
            # chmod +xwr
            sudo chmod +xwr "./resolve_domains_puredns.sh"
            # Run
            # Always run with STD_OUT + STD_IN >/dev/null
            bash "./resolve_domains_puredns.sh" >/dev/null 2>&1
          continue-on-error: true

        - name: Upload_PureDNS_Output
          uses: actions/upload-artifact@v4
          with:
              name: resdns_puredns
              path: |
                /tmp/resdns_puredns_output.7z
#------------------------------------------------------------------------------------#
